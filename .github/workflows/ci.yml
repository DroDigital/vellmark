name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libxtst-dev libxinerama-dev libxrender-dev libgl1-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb

      - uses: Swatinem/rust-cache@v2

      # Linux has Mesa's software renderer, so the capture tests must run there.
      # The hosted Windows and macOS machines may offer no adapter at all; the tests
      # that need one say so and are skipped there, and only there.
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" != "Linux" ]; then export VELLMARK_ALLOW_NO_GPU=1; fi
          cargo test --workspace

      - name: A window opens (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          SDL_VIDEODRIVER: x11
        run: |
          cargo build -p vellmark-app
          timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" target/debug/vellmark --frames 120 --size 640x360

      # A hosted Windows or macOS machine may have no display or adapter. The result is
      # reported and does not fail the job; the owner's Mac is the proof for macOS.
      - name: A window opens (Windows, macOS)
        if: runner.os != 'Linux'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          cargo build -p vellmark-app
          target/debug/vellmark --frames 120 --size 640x360

      - name: Shipping build has no development tools
        run: cargo build -p vellmark-app --no-default-features

      - name: Capture images
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: build/captures
          if-no-files-found: ignore

  licenses:
    name: Licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  macos-app:
    name: macOS app for the owner
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: scripts/package-macos.sh "${{ github.run_number }}"
      # The archive itself: an artifact of the folder would lose the executable bit.
      - uses: actions/upload-artifact@v4
        with:
          name: vellmark-macos-${{ github.run_number }}
          path: build/vellmark-macos-${{ github.run_number }}.zip
          if-no-files-found: error

  packages:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            platform: linux
          - name: Windows
            os: windows-2022
            platform: windows
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libxtst-dev libxinerama-dev libxrender-dev libgl1-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols
      - uses: Swatinem/rust-cache@v2
      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.platform }} "${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: vellmark-${{ matrix.platform }}-${{ github.run_number }}
          path: build/vellmark-${{ matrix.platform }}-${{ github.run_number }}.*
          if-no-files-found: error

  # The three desktop builds of main, kept in one draft release for the owner: drafts are
  # seen only by those who can push to the repository, so nothing is published until the
  # owner publishes it. A new draft replaces the last on each green push to main.
  desktop-builds:
    name: Desktop builds (draft release)
    if: github.ref == 'refs/heads/main'
    needs: [test, licenses, macos-app, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vellmark-*-${{ github.run_number }}
          path: dist
          merge-multiple: true
      - name: Replace the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # Older drafts of these builds go; a build the owner published is never touched.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft and (.tag_name | startswith("showcase-build-"))) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          gh release create "showcase-build-${{ github.run_number }}" --draft --target "$GITHUB_SHA" \
            --title "Showcase build ${{ github.run_number }} (latest main)" \
            --notes-file packaging/RELEASE_NOTES.md dist/*
